services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farm_management}
      POSTGRES_USER: ${POSTGRES_USER:-shamba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shamba-local-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shamba-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shamba} -d ${POSTGRES_DB:-farm_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shamba-postgres:
